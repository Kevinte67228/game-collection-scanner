<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>遊戲書背查重神器 (Game Collection Scanner)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon-192.png" alt="App Icon" class="brand-icon">
      <div class="brand-text">
        <h1>書背查重</h1>
      </div>
      <span class="database-badge" id="db-badge">載入中...</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-sync-github" title="從 GitHub 同步最新資料庫">🔄</button>
      <button class="btn-icon" id="btn-cart" title="今日採購籃">🛒<span id="cart-badge" class="cart-badge hidden">0</span></button>
      <button class="btn-icon" id="btn-torch" title="手電筒">🔦</button>
      <button class="btn-icon" id="btn-orient" title="切換橫向/直向書背">📐</button>
      <button class="btn-icon" id="btn-settings" title="設定">⚙️</button>
    </div>
  </header>

  <!-- Camera Scanner Viewport -->
  <main class="scanner-viewport" id="viewport">
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="roi-canvas" style="display: none;"></canvas>

    <!-- Scanning ROI Guide Overlay -->
    <div class="guide-overlay" id="guide-overlay" data-orientation="horizontal">
      <div class="scan-laser"></div>
      <div class="guide-hint">將書背或商品編號對準框內</div>
    </div>

    <!-- Scanning Progress Indicator -->
    <div class="scanning-status hidden" id="scan-status">
      <span class="spinner">⏳</span>
      <span id="scan-status-text">辨識中...</span>
    </div>
  </main>

  <!-- Bottom Control Bar -->
  <footer class="control-bar">
    <!-- Platform Filter Dropdown -->
    <!-- Platform Filter Dropdown Button -->
    <div style="padding: 12px 16px;">
      <button id="btn-open-platform" style="width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; font-size: 15px; font-weight: 500; text-align: left; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(8px);">
        <span id="current-platform-text">— 不指定 (ALL) —</span>
        <span style="color: #94a3b8; font-size: 12px;">▼</span>
      </button>
    </div>

    <!-- Main Capture & Secondary Actions -->
    <div class="main-actions">
      <button class="btn-secondary-action" id="btn-upload" title="從相簿上傳">🖼️</button>
      <input type="file" id="file-input" accept="image/*" style="display: none;">

      <button class="btn-capture" id="btn-capture" title="拍照辨識">
        <span>📸</span>
      </button>

      <button class="btn-secondary-action" id="btn-sound" title="提示音切換">🔔</button>
    </div>

    <!-- Quick Search Bar -->
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="手動搜尋：輸入中文、日文或編號 (如 SLPS 00542)">
      <button id="search-clear" style="background:none; border:none; color:#888; display:none; cursor:pointer;">✕</button>
    </div>
  </footer>

  <!-- Result Modal Bottom Sheet -->
  <div class="result-sheet" id="result-sheet">
    <div class="sheet-handle" id="sheet-handle"></div>

    <!-- Status Banner -->
    <div class="status-banner owned" id="status-banner">
      <div class="status-banner-icon" id="status-icon">🔴</div>
      <div class="status-banner-content">
        <h2 id="status-title">🔴 已收藏</h2>
        <p id="status-desc">重複注意！不要買！</p>
      </div>
    </div>

    <!-- Matched Game Card -->
    <div class="game-card" id="matched-card">
      <div class="game-title-zh" id="res-title-zh" style="font-size: 19px; font-weight: 700; color: #38bdf8; margin-bottom: 4px;">中文譯名</div>
      <div class="game-title-jp" id="res-title-jp" style="font-size: 15px; color: #f1f5f9; margin-bottom: 2px;">日文原名</div>
      <div class="game-title-en" id="res-title-en" style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">English Title</div>

      <div class="game-meta-row">
        <span class="meta-tag highlight" id="res-platform">PS1</span>
        <span class="meta-tag highlight" id="res-catalog">SLPS 00542</span>
        <span class="meta-tag" id="res-no">No. 99</span>
        <span class="meta-tag" id="res-region">日版</span>
      </div>

      <div class="meta-notes" id="res-notes" style="margin-top: 8px; font-size: 12px; color: #cbd5e1;">發行商 / 備註資訊</div>
    </div>

    <!-- Related / Other Platform Releases -->
    <div class="related-section" id="related-section" style="display: none;">
      <h3>相關或其它主機版本：</h3>
      <div id="related-list"></div>
    </div>

    <!-- Actions for Result: Add to Cart -->
    <div style="display: flex; gap: 8px; margin: 12px 0;">
      <button class="btn-secondary-action" id="btn-add-cart" style="flex: 1; height: 42px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;">
        🛒 加入今日戰利品
      </button>
      <button class="btn-primary" id="btn-close-sheet" style="flex: 1; margin-top: 0; height: 42px;">繼續掃描下一款</button>
    </div>

    <!-- Scanned Spine Image Preview -->
    <div id="roi-preview-container" style="text-align: center; margin-bottom: 8px;">
      <img id="roi-preview" style="max-height: 80px; width: 100%; object-fit: contain; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: #000;" alt="截圖預覽">
    </div>

    <!-- Raw OCR Debug & Instant Correction -->
    <details style="margin-bottom: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 8px;">
      <summary style="font-size: 13px; font-weight: 500; color: #94a3b8; cursor: pointer; user-select: none;">🔍 展開原始辨識文字 (除錯/修改比對)</summary>
      <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 4px; margin-top: 8px;">
        <button id="btn-re-match" style="background: var(--accent-cyan); color: #0b0f19; border: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 4px; cursor: pointer;">重新比對</button>
      </div>
      <textarea id="edit-ocr-text" rows="2" style="width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 12px; padding: 6px; resize: vertical;"></textarea>
    </details>
  </div>

  <!-- Platform Selection Modal -->
  <div class="modal hidden" id="platform-modal">
    <div class="modal-content" style="max-height: 85vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="justify-content: center; position: relative;">
        <h2 style="font-size: 16px; font-weight: 500;">選擇平台</h2>
        <button id="btn-close-platform" style="position: absolute; right: 0; background:none; border:none; color:#94a3b8; font-size: 20px; cursor:pointer;">✕</button>
      </div>
      <div style="padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <input type="text" id="input-platform-search" placeholder="搜尋平台名稱..." style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; outline: none;">
      </div>
      <div id="platform-list" style="overflow-y: auto; flex: 1; margin-top: 8px;">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <!-- Cart / Purchase List Modal -->
  <div class="modal hidden" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 今日採購清單 (<span id="cart-count">0</span>)</h2>
        <button id="btn-close-cart" style="background:none; border:none; color:#fff; font-size: 20px; cursor:pointer;">✕</button>
      </div>
      <div id="cart-items" style="max-height: 280px; overflow-y: auto; margin-bottom: 12px;">
        <p style="color: #64748b; text-align: center; font-size: 13px; padding: 20px 0;">目前尚未加入任何遊戲</p>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btn-copy-cart" class="btn-primary" style="flex: 1; font-size: 12px;">📋 複製文字清單</button>
        <button id="btn-clear-cart" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;">清空</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal hidden" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>系統設定</h2>
        <button id="btn-close-settings" style="background:none; border:none; color:#fff; font-size: 20px; cursor:pointer;">✕</button>
      </div>

      <!-- Cloud Sync Section -->
      <div class="form-group" style="background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); padding: 10px; border-radius: 8px;">
        <label style="color: #38bdf8; font-weight: 700;">🔄 GitHub 雲端資料庫同步</label>
        <input type="text" id="input-github-url" placeholder="GitHub games.json URL" style="font-size: 11px; margin-bottom: 6px;">
        <div style="display: flex; gap: 6px; margin-top: 6px;">
          <button id="btn-sync-now" class="btn-primary" style="margin-top:0; font-size: 12px; padding: 6px 10px; flex: 1;">立即連線 GitHub 更新</button>
        </div>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 6px;" id="db-sync-status">狀態：離線快取中</p>
      </div>

      <!-- Backup / Restore -->
      <div class="form-group">
        <label>資料庫備份與手動匯入</label>
        <div style="display: flex; gap: 6px;">
          <button id="btn-export-json" class="btn-secondary-action" style="flex: 1; font-size: 11px; height: 36px;">📥 下載資料備份</button>
          <button id="btn-import-json-trigger" class="btn-secondary-action" style="flex: 1; font-size: 11px; height: 36px;">📤 匯入本機 JSON</button>
          <input type="file" id="import-json-input" accept=".json" style="display: none;">
        </div>
      </div>

      <!-- OCR Engine -->
      <div class="form-group">
        <label>OCR 辨識引擎</label>
        <select id="select-engine">
          <option value="gemini">Google Gemini Flash (雲端視覺 + 日翻中 推薦)</option>
          <option value="hybrid">雙引擎混合 (Umi-OCR 識字 + Gemini 翻中 極致精度)</option>
          <option value="umi">私有 Umi-OCR 伺服器 (家中電腦 / 內網穿透)</option>
          <option value="tesseract">純離線 Tesseract (無網路備援 / 免金鑰)</option>
        </select>
      </div>

      <!-- Gemini API Key -->
      <div class="form-group" id="gemini-key-group">
        <label>Gemini API Key</label>
        <input type="password" id="input-gemini-key" placeholder="貼上 Google AI Studio API Key">
        <p style="font-size: 11px; color: #64748b; margin-top: 4px;">支援自動日翻中與模糊比對，安全存於本地瀏覽器。</p>
      </div>

      <!-- Umi-OCR Server URL -->
      <div class="form-group" id="umi-url-group">
        <label>Umi-OCR 伺服器 API 網址</label>
        <input type="text" id="input-umi-url" placeholder="http://127.0.0.1:1224/api/ocr 或穿透網址">
        <p style="font-size: 11px; color: #64748b; margin-top: 4px;">家中電腦開啟 Umi-OCR 服務時使用，免網路費用。</p>
      </div>

      <!-- Sensory Feedback -->
      <div class="form-group">
        <label>感官回饋</label>
        <label style="display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; margin-top: 6px;">
          <input type="checkbox" id="check-vibration" checked style="width: auto;"> 啟用手機震動反饋
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; margin-top: 6px;">
          <input type="checkbox" id="check-sound" checked style="width: auto;"> 啟用提示音效
        </label>
      </div>

      <!-- DB Status Info -->
      <div class="form-group">
        <label>當前遊戲庫資訊</label>
        <p style="font-size: 12px; color: #38bdf8;" id="db-info">載入中...</p>
      </div>

      <button class="btn-primary" id="btn-save-settings">儲存設定並套用</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/fuse.min.js"></script>
  <script src="js/tesseract.min.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
