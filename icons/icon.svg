<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Retro Cartridge Silhouette -->
  <rect x="120" y="140" width="272" height="230" rx="24" fill="#1e293b" stroke="#00e5ff" stroke-width="6"/>
  <!-- Label on Cartridge -->
  <rect x="156" y="180" width="200" height="130" rx="12" fill="#e11d48"/>
  <text x="256" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">GAME SCAN</text>

  <!-- Viewfinder Frame Corners -->
  <!-- Top-Left -->
  <path d="M 80 140 L 80 90 A 10 10 0 0 1 90 80 L 140 80" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M 372 80 L 422 80 A 10 10 0 0 1 432 90 L 432 140" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 80 372 L 80 422 A 10 10 0 0 0 90 432 L 140 432" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 372 432 L 422 432 A 10 10 0 0 0 432 422 L 432 372" fill="none" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>

  <!-- Laser Scan Beam -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="url(#laserGrad)" stroke-width="8" filter="url(#cyanGlow)" />
</svg>
